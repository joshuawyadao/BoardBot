name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_app: ${{ steps.classify.outputs.run_app }}
    steps:
      - name: Check out full history for the pull request merge base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete PR diff
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py "$CI_EVENT" "$CI_BASE" "$CI_HEAD"

  repository_verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository and tooling tests
        run: ./scripts/verify-repository.sh

  build_and_rules:
    name: Build and rules
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.run_app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, build and test game rules and sessions
        run: npm run build && npm test

  chromium_linux:
    name: Browser Chromium on Linux
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.run_app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Test game interactions
        run: npm run test:e2e -- --project=chromium
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-chromium

  webkit_linux:
    name: Browser WebKit on Linux
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.run_app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install WebKit and Linux dependencies
        run: npx playwright install --with-deps webkit
      - name: Test game interactions
        run: npm run test:e2e -- --project=webkit
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-webkit

  firefox_linux:
    name: Browser Firefox on Linux
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.run_app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Firefox and Linux dependencies
        run: npx playwright install --with-deps firefox
      - name: Test game interactions
        run: npm run test:e2e -- --project=firefox
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-firefox

  webkit_macos:
    name: Browser WebKit on macOS
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.run_app == 'true' }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Test game interactions
        run: npm run test:e2e -- --project=webkit
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-webkit

  ci-verify:
    name: CI Verify
    needs: [classify_changes, repository_verify, build_and_rules, chromium_linux, webkit_linux, firefox_linux, webkit_macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the expected verification jobs
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_changes.result }}
          REPOSITORY_RESULT: ${{ needs.repository_verify.result }}
          RUN_APP: ${{ needs.classify_changes.outputs.run_app }}
          BUILD_RESULT: ${{ needs.build_and_rules.result }}
          CHROMIUM_RESULT: ${{ needs.chromium_linux.result }}
          WEBKIT_LINUX_RESULT: ${{ needs.webkit_linux.result }}
          FIREFOX_RESULT: ${{ needs.firefox_linux.result }}
          WEBKIT_MACOS_RESULT: ${{ needs.webkit_macos.result }}
        run: python3 scripts/ci_gate.py
