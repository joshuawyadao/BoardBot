name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_rules:
    name: Build and rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository and tooling tests
        run: ./scripts/verify-repository.sh
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, build and test game rules and sessions
        run: npm run build && npm test

  chromium_linux:
    name: Browser Chromium on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Test game interactions
        run: npm run test:e2e -- --project=chromium
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-chromium

  webkit_linux:
    name: Browser WebKit on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install WebKit and Linux dependencies
        run: npx playwright install --with-deps webkit
      - name: Test game interactions
        run: npm run test:e2e -- --project=webkit
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-webkit

  firefox_linux:
    name: Browser Firefox on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Firefox and Linux dependencies
        run: npx playwright install --with-deps firefox
      - name: Test game interactions
        run: npm run test:e2e -- --project=firefox
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-firefox

  webkit_macos:
    name: Browser WebKit on macOS
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Test game interactions
        run: npm run test:e2e -- --project=webkit
      - name: Test production startup and recovery without external services
        run: npm run test:production -- --project=production-webkit

  ci-verify:
    name: CI Verify
    needs: [build_and_rules, chromium_linux, webkit_linux, firefox_linux, webkit_macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          BUILD_RESULT: ${{ needs.build_and_rules.result }}
          CHROMIUM_RESULT: ${{ needs.chromium_linux.result }}
          WEBKIT_LINUX_RESULT: ${{ needs.webkit_linux.result }}
          FIREFOX_RESULT: ${{ needs.firefox_linux.result }}
          WEBKIT_MACOS_RESULT: ${{ needs.webkit_macos.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$CHROMIUM_RESULT" != success ] ||
             [ "$WEBKIT_LINUX_RESULT" != success ] || [ "$FIREFOX_RESULT" != success ] ||
             [ "$WEBKIT_MACOS_RESULT" != success ]; then
            printf 'Build: %s; Chromium: %s; Linux WebKit: %s; Firefox: %s; macOS WebKit: %s\n' \
              "$BUILD_RESULT" "$CHROMIUM_RESULT" "$WEBKIT_LINUX_RESULT" "$FIREFOX_RESULT" "$WEBKIT_MACOS_RESULT"
            exit 1
          fi
