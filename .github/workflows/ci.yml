name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository and tooling tests
        run: ./scripts/verify-repository.sh
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, build and test game rules and sessions
        run: npm run build && npm test
      - name: Install browser for interaction tests
        run: npx playwright install --with-deps chromium
      - name: Test game interactions in Chromium
        run: npm run test:e2e
      - name: Test production startup and recovery without external services
        run: npm run test:production
